<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Courtyard house section with sun path">
  <rect width="800" height="500" fill="#f7f2e9"/>
  <!-- sun path -->
  <path d="M80,380 Q400,60 720,380" fill="none" stroke="#9a5b2e" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="400" cy="150" r="26" fill="none" stroke="#9a5b2e" stroke-width="2"/>
  <g font-family="Georgia,serif" font-size="17" fill="#5c554a" letter-spacing="2">
    <text x="120" y="330">MORNING</text><text x="620" y="330">EVENING</text><text x="368" y="110">NOON</text>
  </g>
  <!-- ground -->
  <line x1="40" y1="420" x2="760" y2="420" stroke="#2b2620" stroke-width="3"/>
  <!-- house masses -->
  <g fill="#e3d5bd" stroke="#2b2620" stroke-width="2.5">
    <rect x="120" y="280" width="180" height="140"/>
    <rect x="500" y="280" width="180" height="140"/>
  </g>
  <!-- roofs -->
  <g stroke="#2b2620" stroke-width="2.5" fill="none">
    <path d="M105,280 L210,220 L315,280"/>
    <path d="M485,280 L590,220 L695,280"/>
  </g>
  <!-- courtyard + stack arrows -->
  <rect x="300" y="280" width="200" height="140" fill="none" stroke="#7c4522" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="400" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="19" letter-spacing="4" fill="#7c4522">COURT</text>
  <g stroke="#7c4522" stroke-width="2" fill="none">
    <path d="M360,410 L360,300 M360,300 l-8,14 M360,300 l8,14"/>
    <path d="M440,410 L440,300 M440,300 l-8,14 M440,300 l8,14"/>
  </g>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia,serif" font-size="20" letter-spacing="6" fill="#5c554a">COURTYARD SECTION — STACK VENTILATION</text>
</svg>
